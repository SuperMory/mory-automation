<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mory-Automation 悬浮控制条</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud-bar {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 4px 8px 4px 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), 0 0 1px rgba(255,255,255,0.2);
      width: 100%;
      height: 40px;
      color: #f8fafc;
      gap: 8px;
    }
    .drag-handle {
      -webkit-app-region: drag;
      cursor: grab;
      color: #64748b;
      font-size: 14px;
      letter-spacing: -2px;
      padding: 0 2px;
      display: flex;
      align-items: center;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: drag;
    }
    .logo-badge img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .status-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: drag;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.running {
      background: #3b82f6;
      box-shadow: 0 0 8px #3b82f6;
      animation: pulse 1.5s infinite;
    }
    .status-dot.paused {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .status-text {
      font-size: 12px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .hud-btn.btn-run {
      background: #10b981;
      border-color: #059669;
      color: #ffffff;
    }
    .hud-btn.btn-run:hover {
      background: #059669;
    }
    .hud-btn.btn-pause {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
      display: none;
    }
    .hud-btn.btn-pause:hover {
      background: #d97706;
    }
    .hud-btn.btn-stop {
      background: #ef4444;
      border-color: #dc2626;
      color: #ffffff;
      display: none;
    }
    .hud-btn.btn-stop:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="hud-bar">
    <div class="drag-handle" title="按住拖拽移动悬浮窗">⋮⋮</div>
    <div class="logo-badge" title="Mory-Automation (魔力自动化) v1.0.0 · 桌面悬浮控制器">
      <img src="../icons/icon48.png" alt="Mory">
      <span style="font-size: 10px; color: #94a3b8; font-weight: 600; padding: 1px 4px; background: rgba(255,255,255,0.08); border-radius: 3px;">v1.0.0</span>
    </div>
    <div class="status-wrap" title="当前执行状态">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text" id="status-text">就绪</div>
    </div>
    <div class="actions">
      <button type="button" class="hud-btn btn-run" id="btn-run" title="启动流程">▶</button>
      <button type="button" class="hud-btn btn-pause" id="btn-pause" title="暂停">⏸</button>
      <button type="button" class="hud-btn btn-stop" id="btn-stop" title="停止">⏹</button>
      <button type="button" class="hud-btn" id="btn-expand" title="置顶展开设计器工作台">🗖</button>
      <button type="button" class="hud-btn" id="btn-close" title="隐藏悬浮窗">&times;</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const btnRun = document.getElementById('btn-run');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const btnExpand = document.getElementById('btn-expand');
    const btnClose = document.getElementById('btn-close');

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    btnRun.addEventListener('click', () => {
      ipcRenderer.send('FLOATING_TRIGGER_ACTION', 'run');
    });

    btnPause.addEventListener('click', () => {
      ipcRenderer.send('FLOATING_TRIGGER_ACTION', 'pause');
    });

    btnStop.addEventListener('click', () => {
      ipcRenderer.send('FLOATING_TRIGGER_ACTION', 'stop');
    });

    btnExpand.addEventListener('click', () => {
      ipcRenderer.send('FLOATING_SHOW_MAIN');
    });

    btnClose.addEventListener('click', () => {
      ipcRenderer.send('FLOATING_HIDE');
    });

    ipcRenderer.on('UPDATE_FLOATING_STATUS', (e, data) => {
      // data: { state: 'idle' | 'running' | 'paused' | 'error' | 'success', text: string }
      if (!data) return;

      statusDot.className = 'status-dot';
      if (data.state === 'running') {
        statusDot.classList.add('running');
        btnRun.style.display = 'none';
        btnPause.style.display = 'flex';
        btnStop.style.display = 'flex';
      } else if (data.state === 'paused') {
        statusDot.classList.add('paused');
        btnRun.style.display = 'flex';
        btnRun.title = '继续执行';
        btnPause.style.display = 'none';
        btnStop.style.display = 'flex';
      } else if (data.state === 'error') {
        statusDot.classList.add('error');
        btnRun.style.display = 'flex';
        btnRun.title = '重新启动流程';
        btnPause.style.display = 'none';
        btnStop.style.display = 'none';
      } else {
        // idle / success
        btnRun.style.display = 'flex';
        btnRun.title = '启动流程';
        btnPause.style.display = 'none';
        btnStop.style.display = 'none';
      }

      if (data.text) {
        statusText.textContent = data.text;
      }
    });
  </script>
</body>
</html>
